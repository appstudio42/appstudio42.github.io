<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; background: transparent; }
      body { display: grid; place-items: center; }
      .mark {
        width: 100%;
        height: 100%;
        border-radius: 22%;
        background: linear-gradient(135deg, #E86A5B, #E8B84A 55%, #5FA8A0);
        display: grid;
        place-items: center;
      }
      svg { width: 62%; height: 62%; }
    </style>
  </head>
  <body>
    <div class="mark">
      <svg viewBox="0 0 32 32" fill="none">
        <circle cx="11" cy="13" r="2.2" fill="#FFF8F3"/>
        <circle cx="21" cy="13" r="2.2" fill="#FFF8F3"/>
        <path d="M10 20c1.6 2.4 3.4 3.5 6 3.5S20.4 22.4 22 20" stroke="#FFF8F3" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>
  </body>
</html>
